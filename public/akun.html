<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pengaturan</title><meta name="theme-color" content="#f4f2ec"><link rel="stylesheet" href="/style.css"></head><body>
<header class="top kecil"><div class="top-in">
<h1><span>Pengaturan</span><span id="nav"><a href="#" id="out">Keluar</a></span></h1>
</div></header>
<main>
<section id="nama"><h2 id="siapa">Ganti nama</h2>
<input id="namaBaru" placeholder="Nama lengkap" autocomplete="name" maxlength="60">
<button id="simpanNama">Simpan nama</button><p class="err" id="en"></p><p class="ok" id="sn"></p></section>
<section id="password"><h2>Ganti password</h2>
<input id="lama" type="password" placeholder="Password lama" autocomplete="current-password">
<input id="baru" type="password" placeholder="Password baru" autocomplete="new-password">
<input id="ulang" type="password" placeholder="Ulangi password baru" autocomplete="new-password">
<button id="ganti">Simpan password</button><p class="err" id="e"></p><p class="ok" id="s"></p></section>
</main>
<script src="/ui.js"></script>
<script>
pasangKeluar();
api('/api/saya').then(d=>{
  $('siapa').textContent='Ganti nama — '+d.nama;
  $('namaBaru').placeholder='Nama lengkap (sekarang: '+d.nama+')';
  $('baru').placeholder='Password baru (min '+(d.peran==='admin'?8:6)+')';
  const beranda=d.peran==='murid'?'/murid':d.peran==='admin'?'/admin':'/guru';
  $('nav').prepend(Object.assign(el('a',null,d.peran==='murid'?'Profil':d.peran==='admin'?'Dashboard':'Beranda'),{href:beranda}));
});
$('simpanNama').onclick=async()=>{
  $('en').textContent='';$('sn').textContent='';
  try{
    const d=await kirim('/api/ganti-nama',{nama:$('namaBaru').value});
    $('namaBaru').value='';$('namaBaru').placeholder='Nama lengkap (sekarang: '+d.nama+')';
    $('siapa').textContent='Ganti nama — '+d.nama;
    $('sn').textContent='Nama berhasil diganti.';
  }catch(e){$('en').textContent=e.message}
};
$('ganti').onclick=async()=>{
  $('e').textContent='';$('s').textContent='';
  if($('baru').value!==$('ulang').value)return $('e').textContent='Password baru dan ulangannya tidak sama.';
  try{
    await kirim('/api/ganti-password',{lama:$('lama').value,baru:$('baru').value});
    $('lama').value=$('baru').value=$('ulang').value='';
    $('s').textContent='Password berhasil diganti. Perangkat lain otomatis keluar.';
  }catch(e){$('e').textContent=e.message}
};
</script></body></html>
